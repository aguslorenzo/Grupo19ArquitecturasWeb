server:
  port: 8080

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      default-zone: http://localhost:8761/eureka
  instance:
    hostname: localhost

spring:
  cloud:
    gateway:
      mvc:
        routes:
          - id: admin-microservice
            uri: lb://admin-microservice
            predicates:
              - Path=/api/administrations/**
          - id: maintenance-microservice
            uri: lb://maintenance-microservice
            predicates:
              - Path=/api/maintenances/**
          - id: map-microservice
            uri: lb://map-microservice
            predicates:
              - Path=/api/maps/**
          - id: scooter-microservice
            uri: lb://scooter-microservice
            predicates:
              - Path=/api/scooters/**
          - id: trip-microservice
            uri: lb://trip-microservice
            predicates:
              - Path=/api/trips/**
          - id: user-microservice
            uri: lb://user-microservice
            predicates:
              - Path=/api/users/**
logging:
  level:
    org.springframework.cloud.gateway: DEBUG