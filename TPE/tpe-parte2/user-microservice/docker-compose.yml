version: '3.3'
services:
  user-microservice:
    build: .
    ports:
      - "8082:8080"
    depends_on:
      - user-db

  user-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: root
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
